<svg width="100%" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>java-research-agent system architecture</title>
<desc>User talks to a Streamlit chat UI, which calls java-research-agent, which calls go-llm-gateway for LLM inference and an MCP client that aggregates three MCP servers: python-rag-mcp, go-search-mcp, and java-flashcard-mcp.</desc>
<style>
.bg-gray{fill:#F1EFE8;stroke:#5F5E5A}
.bg-blue{fill:#E6F1FB;stroke:#185FA5}
.bg-blue-strong{fill:#B5D4F4;stroke:#0C447C}
.bg-teal{fill:#E1F5EE;stroke:#0F6E56}
.txt-title{font:500 14px "Helvetica Neue",Arial,sans-serif}
.txt-sub{font:400 12px "Helvetica Neue",Arial,sans-serif}
.t-gray{fill:#444441}
.t-gray-sub{fill:#5F5E5A}
.t-blue{fill:#0C447C}
.t-blue-sub{fill:#185FA5}
.t-teal{fill:#085041}
.t-teal-sub{fill:#0F6E56}
.edge{stroke:#888780;stroke-width:1.2;fill:none}
.container{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:4 4}
@media (prefers-color-scheme: dark) {
  .bg-gray{fill:#2C2C2A;stroke:#B4B2A9}
  .bg-blue{fill:#0C447C;stroke:#85B7EB}
  .bg-blue-strong{fill:#042C53;stroke:#85B7EB}
  .bg-teal{fill:#085041;stroke:#5DCAA5}
  .t-gray{fill:#D3D1C7}
  .t-gray-sub{fill:#B4B2A9}
  .t-blue{fill:#B5D4F4}
  .t-blue-sub{fill:#85B7EB}
  .t-teal{fill:#9FE1CB}
  .t-teal-sub{fill:#5DCAA5}
  .edge{stroke:#888780}
  .container{stroke:#888780}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- top row -->
<g class="bg-gray"><rect x="20" y="50" width="90" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-gray" x="65" y="82" text-anchor="middle" dominant-baseline="central">User</text>

<g class="bg-gray"><rect x="130" y="50" width="150" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-gray" x="205" y="76" text-anchor="middle" dominant-baseline="central">Streamlit UI</text>
<text class="txt-sub t-gray-sub" x="205" y="97" text-anchor="middle" dominant-baseline="central">Chat frontend</text>

<g class="bg-blue-strong"><rect x="300" y="50" width="210" height="64" rx="8" stroke-width="1.5"/></g>
<text class="txt-title t-blue" x="405" y="76" text-anchor="middle" dominant-baseline="central">java-research-agent</text>
<text class="txt-sub t-blue-sub" x="405" y="97" text-anchor="middle" dominant-baseline="central">Orchestration layer (this repo)</text>

<g class="bg-blue"><rect x="530" y="50" width="190" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-blue" x="625" y="76" text-anchor="middle" dominant-baseline="central">go-llm-gateway</text>
<text class="txt-sub t-blue-sub" x="625" y="97" text-anchor="middle" dominant-baseline="central">LLM inference gateway</text>

<g class="bg-gray"><rect x="740" y="50" width="140" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-gray" x="810" y="76" text-anchor="middle" dominant-baseline="central">LLM Provider</text>
<text class="txt-sub t-gray-sub" x="810" y="97" text-anchor="middle" dominant-baseline="central">OpenAI-compatible</text>

<!-- top row connectors -->
<line class="edge" x1="110" y1="82" x2="128" y2="82" marker-end="url(#arrow)"/>
<line class="edge" x1="280" y1="82" x2="298" y2="82" marker-end="url(#arrow)"/>
<line class="edge" x1="510" y1="82" x2="528" y2="82" marker-end="url(#arrow)"/>
<line class="edge" x1="720" y1="82" x2="738" y2="82" marker-end="url(#arrow)"/>

<!-- connector down to MCP container -->
<line class="edge" x1="405" y1="114" x2="405" y2="188" marker-end="url(#arrow)"/>

<!-- MCP client container -->
<rect class="container" x="60" y="190" width="800" height="240" rx="14"/>
<text class="txt-title t-gray" x="82" y="216" dominant-baseline="central">MCP Client (stdio)</text>
<text class="txt-sub t-gray-sub" x="82" y="236" dominant-baseline="central">Aggregates tools from 3 servers</text>

<!-- MCP server boxes -->
<g class="bg-teal"><rect x="180" y="270" width="150" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-teal" x="255" y="296" text-anchor="middle" dominant-baseline="central">python-rag-mcp</text>
<text class="txt-sub t-teal-sub" x="255" y="317" text-anchor="middle" dominant-baseline="central">RAG retrieval</text>

<g class="bg-teal"><rect x="370" y="270" width="140" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-teal" x="440" y="296" text-anchor="middle" dominant-baseline="central">go-search-mcp</text>
<text class="txt-sub t-teal-sub" x="440" y="317" text-anchor="middle" dominant-baseline="central">Web search</text>

<g class="bg-teal"><rect x="550" y="270" width="190" height="64" rx="8" stroke-width="1"/></g>
<text class="txt-title t-teal" x="645" y="296" text-anchor="middle" dominant-baseline="central">java-flashcard-mcp</text>
<text class="txt-sub t-teal-sub" x="645" y="317" text-anchor="middle" dominant-baseline="central">Knowledge cards</text>

</svg>
